name: Build and Deploy Docker Containers

on:
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'loopback-server/**'
      - 'loopback-angular6/**'
      - 'mcp-server-java/**'
      - 'analise-oportunidades-service/**'
      - 'avaliador-aderencia-service/**'
      - 'deploy/nginx/**'
      - '.github/workflows/deploy-docker-containers.yml'
  workflow_dispatch:

env:
  VPS_HOST: 191.252.92.222
  VPS_PORT: ${{ secrets.VPS_PORTA }}
  VPS_USER: ${{ secrets.VPS_USUARIO }}
  VPS_APP_DIR: ${{ secrets.VPS_DIRETORIO_APP }}
  DOCKER_IMAGE_ARCHIVE: curriculosis-images.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_CHAVE_PRIVADA_SSH }}

      - name: Add VPS to known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VPS_USER:-}" ]; then
            echo "Defina o secret VPS_USUARIO (usuário SSH do servidor)." >&2
            exit 1
          fi

          if [ -z "${{ secrets.VPS_CHAVE_PRIVADA_SSH }}" ]; then
            echo "Defina o secret VPS_CHAVE_PRIVADA_SSH (chave privada SSH)." >&2
            exit 1
          fi

      - name: Build container images on GitHub runner
        shell: bash
        run: |
          set -euo pipefail

          docker compose build --pull
          docker save \
            curriculosis-backend:latest \
            curriculosis-frontend:latest \
            curriculosis-mcp-server:latest \
            curriculosis-analise-oportunidades:latest \
            curriculosis-avaliador-aderencia:latest \
            | gzip > "$RUNNER_TEMP/$DOCKER_IMAGE_ARCHIVE"

          gzip -t "$RUNNER_TEMP/$DOCKER_IMAGE_ARCHIVE"
          (cd "$RUNNER_TEMP" && sha256sum "$DOCKER_IMAGE_ARCHIVE" > "$DOCKER_IMAGE_ARCHIVE.sha256")

      - name: Sync project files to VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${VPS_APP_DIR:-/opt/curriculosis}"
          SSH_PORT="${VPS_PORT:-22}"

          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR'"

          rsync -az --delete \
            --exclude '.git' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            --exclude '**/build' \
            --exclude '**/target' \
            --exclude '**/.angular/cache' \
            --exclude '**/.gradle' \
            --exclude '**/.mvn/wrapper/dists' \
            --exclude '**/coverage' \
            -e "ssh -p $SSH_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Pre-clean Docker cache on VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${VPS_APP_DIR:-/opt/curriculosis}"
          SSH_PORT="${VPS_PORT:-22}"

          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            mkdir -p '$APP_DIR'
            rm -f '$APP_DIR/$DOCKER_IMAGE_ARCHIVE' '$APP_DIR/$DOCKER_IMAGE_ARCHIVE.sha256' '$APP_DIR/$DOCKER_IMAGE_ARCHIVE.tmp' '$APP_DIR/$DOCKER_IMAGE_ARCHIVE.sha256.tmp'
            docker builder prune -af
            docker image prune -af
          "

      - name: Transfer prebuilt images to VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${VPS_APP_DIR:-/opt/curriculosis}"
          SSH_PORT="${VPS_PORT:-22}"

          for attempt in $(seq 1 3); do
            scp -P "$SSH_PORT" \
              "$RUNNER_TEMP/$DOCKER_IMAGE_ARCHIVE" \
              "$RUNNER_TEMP/$DOCKER_IMAGE_ARCHIVE.sha256" \
              "$VPS_USER@$VPS_HOST:$APP_DIR/"

            if ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && gzip -t '$DOCKER_IMAGE_ARCHIVE' && sha256sum -c '$DOCKER_IMAGE_ARCHIVE.sha256'"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Arquivo de imagens Docker chegou corrompido ao VPS após 3 tentativas." >&2
              exit 1
            fi

            ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "rm -f '$APP_DIR/$DOCKER_IMAGE_ARCHIVE' '$APP_DIR/$DOCKER_IMAGE_ARCHIVE.sha256'"
            sleep 5
          done

      - name: Load images and start containers on VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${VPS_APP_DIR:-/opt/curriculosis}"
          SSH_PORT="${VPS_PORT:-22}"

          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$APP_DIR'
            trap 'rm -f \"$APP_DIR/$DOCKER_IMAGE_ARCHIVE\" \"$APP_DIR/$DOCKER_IMAGE_ARCHIVE.sha256\"' EXIT
            gzip -t '$APP_DIR/$DOCKER_IMAGE_ARCHIVE'
            (cd '$APP_DIR' && sha256sum -c '$DOCKER_IMAGE_ARCHIVE.sha256')
            docker compose down --remove-orphans

            # Free the space used by the currently deployed images before
            # loading the replacement archive. Loading over existing tags makes
            # Docker keep the old image layers as dangling images during the
            # import, which can exhaust small VPS disks while unpacking files
            # such as /app/app.jar. Containers are already stopped above, so the
            # tagged images can be removed safely and recreated by docker load.
            docker image rm -f \
              curriculosis-backend:latest \
              curriculosis-frontend:latest \
              curriculosis-mcp-server:latest \
              curriculosis-analise-oportunidades:latest \
              curriculosis-avaliador-aderencia:latest \
              2>/dev/null || true
            docker image prune -af
            docker builder prune -af

            docker load -i '$APP_DIR/$DOCKER_IMAGE_ARCHIVE'

            # The gateway is the only service expected to publish port 80. On
            # this VPS Apache can be left running by the base image/control
            # panel and will keep the port busy even after Compose is stopped.
            # Stop Apache and its socket/timer units before the port wait so the
            # replacement gateway can bind 80 without failing the deployment.
            if command -v systemctl >/dev/null 2>&1; then
              sudo -n systemctl stop apache2 apache2.service apache2.socket apache2@*.service 2>/dev/null || true
              sudo -n systemctl kill apache2 apache2.service apache2.socket apache2@*.service 2>/dev/null || true
            fi

            if command -v service >/dev/null 2>&1; then
              sudo -n service apache2 stop 2>/dev/null || true
            fi

            # Some images/panels immediately respawn Apache workers even after a
            # service stop. If Apache still owns port 80, terminate only those
            # processes so unrelated web services are not affected.
            if (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) | grep -Eq '(:80.*apache2|apache2.*:80)'; then
              sudo -n pkill -TERM -x apache2 2>/dev/null || true
              sleep 2
              sudo -n pkill -KILL -x apache2 2>/dev/null || true
            fi

            # Docker can briefly keep published ports reserved while the old
            # gateway endpoint/proxy is being torn down. Wait for port 80 to be
            # fully released before creating the replacement gateway container,
            # otherwise compose may fail with 'address already in use'.
            for attempt in \$(seq 1 30); do
              if ! (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -Eq '(^|[[:space:]])(0\\.0\\.0\\.0:80|\\[::\\]:80|:::80|\\*:80)[[:space:]]'; then
                break
              fi

              if [ "\$attempt" -eq 30 ]; then
                echo 'Porta 80 ainda ocupada após parar o compose; diagnóstico:' >&2
                (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) | grep -E '(:80[[:space:]]|:80$)' >&2 || true
                docker ps --filter publish=80 --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}' >&2 || true
                exit 1
              fi

              sleep 2
            done

            docker compose up -d --no-build --remove-orphans
            docker image prune -af
            docker builder prune -af
          "

      - name: Show running containers
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${VPS_PORT:-22}"
          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
