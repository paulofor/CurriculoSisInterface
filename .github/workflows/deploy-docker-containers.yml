name: Build and Deploy Docker Containers

on:
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'loopback-server/**'
      - 'loopback-angular6/**'
      - 'mcp-server-java/**'
      - 'analise-oportunidades-service/**'
      - 'avaliador-aderencia-service/**'
      - 'deploy/nginx/**'
      - '.github/workflows/deploy-docker-containers.yml'
  workflow_dispatch:

env:
  VPS_HOST: 191.252.92.222
  VPS_PORT: ${{ secrets.VPS_PORTA }}
  VPS_USER: ${{ secrets.VPS_USUARIO }}
  VPS_APP_DIR: ${{ secrets.VPS_DIRETORIO_APP }}
  DOCKER_IMAGE_ARCHIVE: curriculosis-images.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_CHAVE_PRIVADA_SSH }}

      - name: Add VPS to known_hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VPS_USER:-}" ]; then
            echo "Defina o secret VPS_USUARIO (usuário SSH do servidor)." >&2
            exit 1
          fi

          if [ -z "${{ secrets.VPS_CHAVE_PRIVADA_SSH }}" ]; then
            echo "Defina o secret VPS_CHAVE_PRIVADA_SSH (chave privada SSH)." >&2
            exit 1
          fi

      - name: Build container images on GitHub runner
        shell: bash
        run: |
          set -euo pipefail

          docker compose build --pull
          docker save \
            curriculosis-backend:latest \
            curriculosis-frontend:latest \
            curriculosis-mcp-server:latest \
            curriculosis-analise-oportunidades:latest \
            curriculosis-avaliador-aderencia:latest \
            | gzip > "$RUNNER_TEMP/$DOCKER_IMAGE_ARCHIVE"

      - name: Sync project files to VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${VPS_APP_DIR:-/opt/curriculosis}"
          SSH_PORT="${VPS_PORT:-22}"

          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR'"

          rsync -az --delete \
            --exclude '.git' \
            --exclude '**/node_modules' \
            --exclude '**/dist' \
            --exclude '**/build' \
            --exclude '**/target' \
            --exclude '**/.angular/cache' \
            --exclude '**/.gradle' \
            --exclude '**/.mvn/wrapper/dists' \
            --exclude '**/coverage' \
            -e "ssh -p $SSH_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Pre-clean Docker cache on VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${VPS_APP_DIR:-/opt/curriculosis}"
          SSH_PORT="${VPS_PORT:-22}"

          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            mkdir -p '$APP_DIR'
            rm -f '$APP_DIR/$DOCKER_IMAGE_ARCHIVE'
            docker builder prune -af
            docker image prune -af
          "

      - name: Transfer prebuilt images to VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${VPS_APP_DIR:-/opt/curriculosis}"
          SSH_PORT="${VPS_PORT:-22}"

          scp -P "$SSH_PORT" "$RUNNER_TEMP/$DOCKER_IMAGE_ARCHIVE" "$VPS_USER@$VPS_HOST:$APP_DIR/$DOCKER_IMAGE_ARCHIVE"

      - name: Load images and start containers on VPS
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="${VPS_APP_DIR:-/opt/curriculosis}"
          SSH_PORT="${VPS_PORT:-22}"

          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$APP_DIR'
            trap 'rm -f \"$APP_DIR/$DOCKER_IMAGE_ARCHIVE\"' EXIT
            docker load -i '$APP_DIR/$DOCKER_IMAGE_ARCHIVE'
            docker compose up -d --no-build --remove-orphans
            docker image prune -af
            docker builder prune -af
          "

      - name: Show running containers
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${VPS_PORT:-22}"
          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
