services:
  backend:
    image: curriculosis-backend:latest
    build:
      context: ./loopback-server
      dockerfile: Dockerfile
    container_name: curriculosis-backend
    ports:
      - "25012:25012"
    environment:
      - BACKEND_LOG_FILE=/var/log/curriculosis/backend.log
    volumes:
      - backend-logs:/var/log/curriculosis
    restart: unless-stopped

  frontend:
    image: curriculosis-frontend:latest
    build:
      context: ./loopback-angular6
      dockerfile: Dockerfile
    container_name: curriculosis-frontend
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  mcp-server:
    image: curriculosis-mcp-server:latest
    build:
      context: ./mcp-server-java
      dockerfile: Dockerfile
    container_name: curriculosis-mcp-server
    expose:
      - "8090"
    volumes:
      - backend-logs:/var/log/curriculosis:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend
    restart: unless-stopped



  analise-oportunidades:
    image: curriculosis-analise-oportunidades:latest
    build:
      context: ./analise-oportunidades-service
      dockerfile: Dockerfile
    container_name: curriculosis-analise-oportunidades
    expose:
      - "8081"
    environment:
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - LOGGING_FILE_NAME=/var/log/curriculosis/analise-oportunidades.log
    volumes:
      - backend-logs:/var/log/curriculosis
    secrets:
      - openai_api_key
    restart: unless-stopped


  avaliador-aderencia:
    image: curriculosis-avaliador-aderencia:latest
    build:
      context: ./avaliador-aderencia-service
      dockerfile: Dockerfile
    container_name: curriculosis-avaliador-aderencia
    expose:
      - "8082"
    environment:
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - LOGGING_FILE_NAME=/var/log/curriculosis/avaliador-aderencia.log
      - AVALIADOR_BACKEND_BASE_URL=http://backend:25012
      - AVALIADOR_BACKEND_RESULTADOS_PATH=/api/avaliador-aderencia/resultados
      - AVALIADOR_SCHEDULER_CRON=0 0 */6 * * *
      - AVALIADOR_LOTE_TAMANHO=10
    volumes:
      - backend-logs:/var/log/curriculosis
    secrets:
      - openai_api_key
    depends_on:
      - backend
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: curriculosis-gateway
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - mcp-server
      - analise-oportunidades
      - avaliador-aderencia
    restart: unless-stopped

volumes:
  backend-logs:

secrets:
  openai_api_key:
    file: /root/infra/openai-token/openai_api_key
