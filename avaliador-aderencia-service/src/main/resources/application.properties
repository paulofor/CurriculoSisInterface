spring.application.name=avaliador-aderencia-service
server.port=8082

avaliador.scheduler.enabled=${AVALIADOR_SCHEDULER_ENABLED:true}
avaliador.scheduler.cron=${AVALIADOR_SCHEDULER_CRON:0 0 * * * *}
avaliador.lote.tamanho=${AVALIADOR_LOTE_TAMANHO:10}
avaliador.backend.base-url=${AVALIADOR_BACKEND_BASE_URL:http://backend:25012}
avaliador.backend.resultados-path=${AVALIADOR_BACKEND_RESULTADOS_PATH:/api/avaliador-aderencia/resultados}

openai.api.key=${OPENAI_API_KEY:}
openai.api.key.file=${OPENAI_API_KEY_FILE:}
openai.model=${OPENAI_MODEL:gpt-5.2}

logging.file.name=${LOGGING_FILE_NAME:}
management.endpoints.web.exposure.include=health,info
