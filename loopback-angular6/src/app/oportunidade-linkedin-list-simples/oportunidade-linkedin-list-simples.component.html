<div class="dgc-painel">
	<div class="dgc-painel-header">
		<span>Oportunidades Linkedin</span>
	</div>
	<div class="dgc-painel-principal" *ngIf="listaBase">
		<div class="dgc-card" *ngFor="let item of listaBase">
			<div class="dgc-card-header">
				<span routerLink="/oportunidade/{{item.id}}" class="dgc-link">{{item.nome}}</span>
			</div>
			<div class="dgc-card-comandos">
				<button class="btn-primary btn-sm btn" routerLink="/oportunidade/{{item.id}}">Detalhes</button>
			</div>
		</div>
  	</div>
</div>
